<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MChat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f2f5;
}

.header {
    height: 60px;
    background: #075e54;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 18px;
    font-size: 21px;
    font-weight: bold;
}

.chat-list {
    background: white;
    min-height: calc(100vh - 60px);
}

.chat {
    height: 75px;
    display: flex;
    align-items: center;
    padding: 10px 15px;
    border-bottom: 1px solid #eee;
}

.avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #25d366;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    margin-right: 14px;
}

.name {
    font-size: 17px;
    font-weight: bold;
}

.status {
    color: #777;
    font-size: 14px;
    margin-top: 4px;
}
</style>
</head>

<body>

<div class="header">
    MChat
</div>

<div class="chat-list">

    <div class="chat" onclick="openChat()">
        <div class="avatar">M</div>

        <div>
            <div class="name">Murad</div>
            <div class="status">Söhbətə başla</div>
        </div>
    </div>

</div>

<script>
function openChat() {
    alert("Murad ilə söhbət açıldı");
}
</script>

</body>
  </html>
